<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eiger Store | Tropical Adventure</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e31e24;
            /* Eiger Red */
            --dark: #1a1a1a;
            --light: #ffffff;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--dark);
            color: var(--light);
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)), url('background.png');
            background-size: cover;
            background-position: center;
            filter: brightness(0.8);
            transform: scale(1.1);
            animation: zoomOut 20s infinite alternate;
        }

        @keyframes zoomOut {
            from {
                transform: scale(1.1);
            }

            to {
                transform: scale(1);
            }
        }

        .container {
            max-width: 800px;
            padding: 40px;
            text-align: center;
            z-index: 1;
        }

        .logo-container {
            margin-bottom: 3rem;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .main-logo {
            max-width: 220px;
            height: auto;
            background: #ffffff;
            padding: 15px 25px;
            border-radius: 16px;
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.4),
                0 0 0 4px rgba(255, 255, 255, 0.1);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            z-index: 2;
        }

        .logo-container::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(227, 30, 36, 0.2) 0%, transparent 70%);
            z-index: 1;
            pointer-events: none;
        }

        .main-logo:hover {
            transform: translateY(-10px) rotateY(10deg) scale(1.02);
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.5),
                0 0 0 6px rgba(227, 30, 36, 0.3);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 50px 40px;
            border-radius: 40px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            width: 90%;
            max-width: 580px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.2rem;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
            letter-spacing: -1px;
        }

        p {
            font-size: 1rem;
            font-weight: 400;
            margin-bottom: 2.5rem;
            color: rgba(255, 255, 255, 0.9);
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        .category-select {
            width: 100%;
            padding: 12px 15px;
            font-size: 1.1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            margin-bottom: 2rem;
            outline: none;
            backdrop-filter: blur(10px);
            font-family: inherit;
        }

        .category-select option {
            background: #222;
            color: white;
        }

        .cta-btn.disabled {
            background: #555;
            box-shadow: none;
            cursor: not-allowed;
            pointer-events: none;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 45px;
            background: #e31e24;
            color: white;
            text-decoration: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 15px 35px rgba(227, 30, 36, 0.4);
            border: none;
        }

        .cta-btn:hover {
            transform: translateY(-3px) scale(1.02);
            background: #ff2d33;
            box-shadow: 0 20px 45px rgba(227, 30, 36, 0.5);
        }

        .cta-btn svg {
            width: 26px;
            height: 26px;
            fill: white;
        }

        .footer-note {
            margin-top: 3.5rem;
            font-size: 0.85rem;
            opacity: 0.7;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }

            .glass-card {
                padding: 40px 25px;
                border-radius: 30px;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="bg-container"></div>

    <div class="container">
        <div class="glass-card">
            <div class="logo-container">
                <img src="logo.png" alt="Eiger Logo" class="main-logo">
            </div>
            <h1>Petualangan Anda Dimulai di Sini</h1>
            <p>Butuh perlengkapan outdoor atau informasi produk terbaru? Asisten AI kami siap membantu Anda kapan saja.
            </p>

            <select id="userCategory" class="category-select" onchange="updateChatLink()">
                <option value="">-- Pilih Kategori Produk --</option>
            </select>

            <a href="#" id="chatBtn" class="cta-btn disabled">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" />
                </svg>
                <span id="btnText">Pilih Kategori Dulu</span>
            </a>

            <div id="statusMessage" style="margin-top: 15px; font-size: 0.9rem; color: #ffcccb;"></div>

            <div class="footer-note">
                Online 24/7 untuk menemani petualangan Anda.
            </div>
        </div>
    </div>
    <script>
        // Load categories on start
        fetch('/api/bot/categories')
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('userCategory');
                if(data.categories && data.categories.length > 0) {
                    data.categories.forEach(catItem => {
                        const catName = typeof catItem === 'object' ? catItem.name : catItem;
                        const opt = document.createElement('option');
                        opt.value = catName;
                        opt.textContent = catName.charAt(0).toUpperCase() + catName.slice(1);
                        select.appendChild(opt);
                    });
                } else {
                    select.innerHTML = '<option value="">Produk Belum Tersedia</option>';
                }
            })
            .catch(err => console.error("Error loading categories", err));

        function updateChatLink() {
            const category = document.getElementById('userCategory').value;
            const btn = document.getElementById('chatBtn');
            const btnText = document.getElementById('btnText');
            const statusMsg = document.getElementById('statusMessage');
            
            if(!category) {
                btn.classList.add('disabled');
                btn.removeAttribute('href');
                btn.style.pointerEvents = 'none';
                btnText.textContent = "Pilih Kategori Dulu";
                statusMsg.textContent = "";
                return;
            }

            // Fetch bot status for the selected category
            fetch(`/api/bot/status?category=${category}`)
                .then(res => res.json())
                .then(data => {
                    if (data.isReady && data.phoneNumber) {
                        btn.classList.remove('disabled');
                        btn.href = `https://wa.me/${data.phoneNumber}`;
                        btn.style.pointerEvents = 'auto';
                        btnText.textContent = "Chat di WhatsApp";
                        statusMsg.style.color = '#90EE90';
                        statusMsg.textContent = "Bot tersedia dan siap melayani!";
                    } else {
                        btn.classList.add('disabled');
                        btn.removeAttribute('href');
                        btn.style.pointerEvents = 'none';
                        btnText.textContent = "Bot Offline";
                        statusMsg.style.color = '#ffcccb';
                        statusMsg.textContent = "Maaf, bot untuk kategori ini sedang offline/belum dikonfigurasi admin.";
                    }
                })
                .catch(err => {
                    console.error("Status check failed", err);
                    statusMsg.textContent = "Gagal mengecek status bot.";
                });
        }
    </script>
</body>

</html>
